<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Login</title>

<style>

*{
    box-sizing:border-box;
    font-family:"Cairo",sans-serif;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top,#3b82f6,#111827 60%);
    overflow:hidden;
}


/* إضاءة خلفية */
body::before{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    background:#00eaff;
    filter:blur(120px);
    animation:move 6s infinite alternate;
}

@keyframes move{
    from{
        transform:translate(-100px,-100px);
    }
    to{
        transform:translate(100px,100px);
    }
}


.container{

    width:350px;
    padding:35px;

    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(15px);

    border-radius:25px;

    box-shadow:
    0 0 30px rgba(0,234,255,.4);

    animation:show .8s ease;

}


@keyframes show{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}


h2{
    text-align:center;
    color:white;
    margin-bottom:30px;
    text-shadow:0 0 15px #00eaff;
}


input{

    width:100%;
    padding:15px;
    margin:12px 0;

    border:none;
    outline:none;

    border-radius:15px;

    background:rgba(255,255,255,.15);
    color:white;

    font-size:15px;

    transition:.3s;
}


input::placeholder{
    color:#ddd;
}


input:focus{

    transform:scale(1.03);

    box-shadow:
    0 0 15px #00eaff;

}


button{

    width:100%;
    padding:15px;
    margin-top:20px;

    border:none;
    border-radius:18px;

    cursor:pointer;

    background:linear-gradient(
    45deg,
    #00eaff,
    #2563eb
    );

    color:white;

    font-size:17px;
    font-weight:bold;

    box-shadow:
    0 0 20px #00eaff;

    transition:.3s;

}


button:hover{

    transform:translateY(-4px);

    box-shadow:
    0 0 35px #00eaff;

}


</style>

</head>


<body>


<div class="container">

<h2>🎮 Game Login</h2>


<form id="gameForm">

<input type="email"
id="email"
placeholder="📧 البريد الإلكتروني"
required>


<input type="password"
id="password"
placeholder="🔒 كلمة مرور اللعبة"
required>


<button type="submit">
🎮 ابدأ اللعب مع أصدقائك
</button>


</form>

</div>



<script>

document.getElementById("gameForm")
.addEventListener("submit",function(e){

e.preventDefault();

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;


console.log(email);
console.log(password);


});


</script>


</body>
</html>
