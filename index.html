<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ساحة الأساطير</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',Tahoma,sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#020817;
}

body{
display:flex;
justify-content:center;
align-items:center;
}

/* الخلفية */

.background{

position:fixed;
inset:0;

background:
linear-gradient(
135deg,
#020817,
#062046,
#0b3b6f,
#062046,
#020817);

background-size:500% 500%;

animation:bg 18s ease infinite;

}

@keyframes bg{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

/* الضباب */

.blur{

position:absolute;
border-radius:50%;
filter:blur(140px);
opacity:.30;

}

.b1{

width:420px;
height:420px;

background:#00bfff;

left:-120px;
top:-120px;

animation:move1 12s ease-in-out infinite alternate;

}

.b2{

width:500px;
height:500px;

background:#1d4ed8;

right:-150px;
bottom:-150px;

animation:move2 14s ease-in-out infinite alternate;

}

@keyframes move1{

100%{

transform:
translate(140px,80px);

}

}

@keyframes move2{

100%{

transform:
translate(-120px,-90px);

}

}

/* المحتوى */

.container{

position:relative;

z-index:5;

text-align:center;

width:min(92%,800px);

padding:20px;

}

.logo{

font-size:clamp(45px,7vw,90px);

font-weight:900;

color:white;

letter-spacing:2px;

text-shadow:

0 0 10px #00c8ff,

0 0 30px #00c8ff,

0 0 60px #1d4ed8,

0 0 120px #1d4ed8;

animation:logo 1.5s;

}

@keyframes logo{

0%{

opacity:0;
transform:translateY(-60px);

}

100%{

opacity:1;
transform:translateY(0);

}

}

.desc{

margin-top:35px;

font-size:clamp(18px,2.8vw,30px);

line-height:2.2;

color:#dbeafe;

text-shadow:0 0 12px #38bdf8;

animation:fade 2.5s;

}

@keyframes fade{

from{

opacity:0;

}

to{

opacity:1;

}

}

.start{

margin-top:60px;

padding:20px 80px;

font-size:26px;

font-weight:bold;

border:none;

border-radius:70px;

cursor:pointer;

color:white;

background:

linear-gradient(90deg,#00c8ff,#2563eb);

box-shadow:

0 0 20px #00c8ff,

0 0 50px #2563eb,

0 0 90px #2563eb;

transition:.35s;

}

.start:hover{

transform:scale(1.08);

box-shadow:

0 0 40px #00c8ff,

0 0 80px #2563eb,

0 0 140px #2563eb;

}

.footer{

position:absolute;

bottom:25px;

width:100%;

text-align:center;

font-size:14px;

color:#93c5fd;

}

.star{

position:absolute;

width:2px;

height:2px;

background:white;

border-radius:50%;

opacity:.8;

animation:float linear infinite;

}

@keyframes float{

0%{

transform:translateY(110vh);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-20vh);

opacity:0;

}

}

</style>

</head>

<body>

<div class="background">

<div class="blur b1"></div>

<div class="blur b2"></div>

</div>

<div class="container">

<div class="logo">

⚔ ســــاحــــة الأســــاطــــير ⚔

</div>

<div class="desc">

مرحبًا بك في عالمٍ لا يعترف إلا بالشجعان...

<br><br>

هنا تبدأ الرحلة...

وهنا تُكتب أسماء الأساطير...

<br><br>

كل خطوة تقودك إلى المجد...

وكل قرار قد يغير مصيرك...

</div>

<button class="start">

🚀 ابدأ الآن

</button>

</div>

<div class="footer">

LEGENDS ARENA © 2026

</div>

<script>

for(let i=0;i<220;i++){

let s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"%";

s.style.top=Math.random()*100+"%";

s.style.animationDuration=(4+Math.random()*10)+"s";

s.style.animationDelay=Math.random()*8+"s";

document.body.appendChild(s);

}

</script>

</body>
</html>
