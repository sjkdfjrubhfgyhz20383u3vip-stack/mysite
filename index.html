<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ساحة الأساطير</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,sans-serif}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#020617,#0f172a,#0c4a6e,#1e3a8a);
background-size:400% 400%;
animation:bg 12s ease infinite;
position:relative;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

body::before{
content:"";
position:absolute;
width:200%;
height:200%;
background:
radial-gradient(circle,#38bdf833 2px,transparent 2px);
background-size:80px 80px;
animation:move 25s linear infinite;
opacity:.4;
}

@keyframes move{
from{transform:translateY(0);}
to{transform:translateY(300px);}
}

.box{
position:relative;
z-index:2;
width:90%;
max-width:700px;
padding:35px;
border-radius:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.15);
text-align:center;
box-shadow:0 0 40px rgba(0,180,255,.4);
}

h1{
font-size:55px;
color:#fff;
text-shadow:0 0 10px #38bdf8,0 0 30px #2563eb;
animation:pulse 2s infinite;
}

@keyframes pulse{
50%{text-shadow:0 0 20px #7dd3fc,0 0 50px #3b82f6;}
}

p{
margin:25px 0;
font-size:22px;
line-height:2;
color:#dbeafe;
}

button{
padding:18px 65px;
font-size:24px;
font-weight:bold;
border:none;
border-radius:50px;
cursor:pointer;
color:#fff;
background:linear-gradient(90deg,#0ea5e9,#2563eb);
box-shadow:0 0 20px #38bdf8;
transition:.3s;
}

button:hover{
transform:scale(1.08);
box-shadow:0 0 40px #38bdf8;
}

small{
display:block;
margin-top:25px;
color:#93c5fd;
}
</style>
</head>

<body>

<div class="box">

<h1>⚔ ساحة الأساطير ⚔</h1>

<p>
مرحبًا بك في عالم الشجعان.<br>
قاتل... انتصر... واكتب اسمك بين الأساطير.<br>
هل أنت مستعد لبدء رحلتك؟
</p>

<button onclick="location.href='page2.html'">
🚀 ابدأ الآن
</button>

<small>LEGENDS ARENA © 2026</small>

</div>

</body>
</html>
