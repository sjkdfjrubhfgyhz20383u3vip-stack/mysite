<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ساحة الأساطير</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
overflow:hidden;
background:#05060f;
}

/* الخلفية */

.hero{
position:relative;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
overflow:hidden;
background:
linear-gradient(130deg,#02040d,#081d33,#22002f,#02040d);
background-size:500% 500%;
animation:bg 15s ease infinite;
}

@keyframes bg{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

/* دوائر ضوئية */

.hero::before{

content:"";

position:absolute;

width:1800px;

height:1800px;

background:

radial-gradient(circle,#00d9ff33,transparent 60%),

radial-gradient(circle,#ffb30033,transparent 70%),

radial-gradient(circle,#8a2be233,transparent 75%);

animation:rotate 25s linear infinite;

}

@keyframes rotate{

100%{
transform:rotate(360deg);
}

}

/* النجوم */

.star{

position:absolute;

width:3px;

height:3px;

background:white;

border-radius:50%;

animation:up linear infinite;

opacity:.8;

}

@keyframes up{

0%{

transform:translateY(110vh);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-20vh);

opacity:0;

}

}

/* المحتوى */

.content{

position:relative;

z-index:2;

padding:20px;

}

/* العنوان */

h1{

font-size:80px;

color:#fff;

text-shadow:

0 0 10px gold,

0 0 30px orange,

0 0 70px #ff9800,

0 0 100px red;

animation:title 2s ease;

}

@keyframes title{

0%{

transform:translateY(-120px);

opacity:0;

}

100%{

transform:translateY(0);

opacity:1;

}

}

/* النص */

p{

margin-top:35px;

font-size:28px;

line-height:55px;

color:#e8f6ff;

text-shadow:0 0 10px cyan;

animation:fade 3s;

}

@keyframes fade{

from{

opacity:0;

}

to{

opacity:1;

}

}

/* الزر */

button{

margin-top:60px;

padding:22px 80px;

font-size:28px;

font-weight:bold;

border:none;

border-radius:80px;

cursor:pointer;

background:linear-gradient(90deg,#ff9800,#ffd700);

color:white;

box-shadow:

0 0 20px gold,

0 0 40px orange,

0 0 80px red;

transition:.35s;

}

button:hover{

transform:scale(1.08);

box-shadow:

0 0 40px gold,

0 0 80px orange,

0 0 120px red;

}

/* الأسفل */

.footer{

position:absolute;

bottom:20px;

width:100%;

text-align:center;

color:#c8d9ff;

font-size:16px;

letter-spacing:2px;

}

</style>

</head>

<body>

<div class="hero">

<div class="content">

<h1>

⚔️ ســــاحــــة الأســــاطــــير ⚔️

</h1>

<p>

🔥 استعد للدخول إلى عالم لا يعترف إلا بالأقوياء 🔥

<br><br>

⚡ الشجاعة هي طريقك... والقوة هي سلاحك... والنصر ينتظر من يستحقه ⚡

<br><br>

🏆 هل أنت مستعد لتبدأ رحلتك نحو المجد؟

</p>

<button onclick="window.location.href='page2.html'">

🚀 ابــــدأ الآن

</button>

</div>

<div class="footer">

© جميع الحقوق محفوظة

</div>

</div>

<script>

for(let i=0;i<180;i++){

let s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"%";

s.style.animationDuration=(4+Math.random()*8)+"s";

s.style.animationDelay=Math.random()*8+"s";

document.body.appendChild(s);

}

</script>

</body>

</html>
