<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LEGENDS ARENA</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
overflow:hidden;
background:#050816;
}

.hero{
position:relative;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
overflow:hidden;
}

/* Animated Background */

.hero::before{
content:"";
position:absolute;
width:250%;
height:250%;
background:
radial-gradient(circle,#00d9ff22 5%,transparent 6%),
radial-gradient(circle,#ff00aa22 5%,transparent 6%);
background-size:120px 120px;
animation:bgMove 30s linear infinite;
}

@keyframes bgMove{

0%{
transform:rotate(0deg) translateY(0);
}

100%{
transform:rotate(360deg) translateY(-300px);
}

}

.overlay{
position:absolute;
inset:0;
background:linear-gradient(to top,#050816,#05081688,#050816);
}

/* Logo */

.logo{
position:relative;
font-size:75px;
font-weight:bold;
letter-spacing:6px;
color:white;

text-shadow:

0 0 10px cyan,
0 0 30px cyan,
0 0 60px blue;
}

/* Subtitle */

.subtitle{

position:relative;

margin-top:20px;

font-size:25px;

color:#d8e9ff;

text-align:center;

max-width:700px;

line-height:40px;

}

/* Start Button */

.start{

margin-top:60px;

padding:18px 70px;

border:none;

border-radius:60px;

font-size:24px;

cursor:pointer;

font-weight:bold;

background:linear-gradient(90deg,#00d9ff,#00ff99);

color:white;

box-shadow:

0 0 20px cyan,

0 0 50px cyan;

transition:.4s;

position:relative;

}

.start:hover{

transform:scale(1.1);

box-shadow:

0 0 30px cyan,

0 0 70px cyan;

}

/* Floating Lights */

.light{

position:absolute;

border-radius:50%;

background:white;

animation:float 8s linear infinite;

opacity:.6;

}

@keyframes float{

0%{

transform:translateY(120vh);

opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(-20vh);

opacity:0;

}

}

.l1{

width:5px;

height:5px;

left:15%;

animation-duration:8s;

}

.l2{

width:8px;

height:8px;

left:40%;

animation-duration:10s;

}

.l3{

width:6px;

height:6px;

left:70%;

animation-duration:7s;

}

.l4{

width:10px;

height:10px;

left:90%;

animation-duration:11s;

}

/* Bottom Text */

.footer{

position:absolute;

bottom:20px;

font-size:15px;

color:#8aa7ff;

letter-spacing:2px;

}

</style>

</head>

<body>

<div class="hero">

<div class="overlay"></div>

<div class="light l1"></div>
<div class="light l2"></div>
<div class="light l3"></div>
<div class="light l4"></div>

<div class="logo">

LEGENDS ARENA

</div>

<div class="subtitle">

ENTER THE ULTIMATE BATTLEFIELD<br>

ONLY THE STRONG SURVIVE<br>

YOUR DESTINY STARTS NOW

</div>

<button class="start"

onclick="window.location.href='page2.html'">

START GAME

</button>

<div class="footer">

© 2026 LEGENDS ARENA

</div>

</div>

</body>
</html>
