<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدي العباقرة</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Cairo",sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(-45deg,#020617,#0f172a,#0c4a6e,#1d4ed8);
background-size:400% 400%;
animation:bg 15s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

body::before{
content:"";
position:absolute;
width:220%;
height:220%;
background:
radial-gradient(circle,#38bdf81e 2px,transparent 3px);
background-size:60px 60px;
animation:stars 20s linear infinite;
}

@keyframes stars{
from{transform:translateY(0);}
to{transform:translateY(250px);}
}

.card{
position:relative;
z-index:2;
width:90%;
max-width:700px;
padding:45px;
border-radius:30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
box-shadow:0 0 40px rgba(0,180,255,.4);
text-align:center;
}

.logo{
font-size:70px;
margin-bottom:20px;
animation:float 3s ease-in-out infinite;
}

@keyframes float{
50%{transform:translateY(-10px);}
}

h1{
color:#fff;
font-size:48px;
text-shadow:0 0 15px #38bdf8;
}

p{
margin:25px 0;
font-size:22px;
line-height:2;
color:#dbeafe;
}

button{
padding:18px 65px;
font-size:24px;
font-weight:bold;
border:none;
border-radius:50px;
cursor:pointer;
color:#fff;
background:linear-gradient(90deg,#06b6d4,#2563eb);
box-shadow:0 0 20px #38bdf8;
transition:.3s;
}

button:hover{
transform:scale(1.08);
box-shadow:0 0 40px #60a5fa;
}

.footer{
margin-top:25px;
font-size:15px;
color:#93c5fd;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">🧠</div>

<h1>تحدي العباقرة</h1>

<p>
هل تظن أن معلوماتك كافية لتصل إلى القمة؟<br>
اختبر ذكاءك، نافس اللاعبين، واجمع أكبر عدد من النقاط.<br><br>
كل سؤال يقربك من لقب البطل.
</p>

<button onclick="location.href='page2.html'">
🚀 ابدأ التحدي
</button>

<div class="footer">
الإصدار الأول • 2026
</div>

</div>

</body>
</html>
