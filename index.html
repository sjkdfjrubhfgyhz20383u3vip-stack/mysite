<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تحدي العباقرة</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Cairo",sans-serif;
}


body{

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:
    radial-gradient(circle at top,#38bdf8,#020617 65%);

}


/* دوائر الإضاءة */

body::before{

    content:"";
    position:absolute;

    width:500px;
    height:500px;

    background:#0ea5e9;
    filter:blur(150px);

    animation:light 6s infinite alternate;

}


@keyframes light{

    from{
        transform:translate(-150px,-100px);
    }

    to{
        transform:translate(150px,100px);
    }

}



.card{

    position:relative;
    z-index:2;

    width:90%;
    max-width:650px;

    padding:45px 35px;

    text-align:center;

    border-radius:35px;

    background:
    rgba(255,255,255,.10);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.2);


    box-shadow:

    0 0 40px rgba(14,165,233,.5);


    animation:show 1s ease;

}



@keyframes show{

from{

opacity:0;
transform:translateY(50px) scale(.9);

}

to{

opacity:1;
transform:translateY(0) scale(1);

}

}



.logo{

    font-size:80px;

    animation:float 3s infinite ease-in-out;

}



@keyframes float{

50%{

transform:translateY(-15px);

}

}



h1{

    color:white;

    font-size:50px;

    margin-top:15px;

    text-shadow:

    0 0 15px #38bdf8,

    0 0 35px #38bdf8;

}



p{

    color:#e0f2fe;

    font-size:21px;

    line-height:2;

    margin:25px 0;

}



.start{

    display:inline-block;

    padding:18px 70px;

    border-radius:50px;

    text-decoration:none;

    color:white;

    font-size:24px;

    font-weight:bold;


    background:

    linear-gradient(45deg,#06b6d4,#2563eb);


    box-shadow:

    0 0 20px #38bdf8;


    transition:.4s;


}



.start:hover{

    transform:scale(1.1);

    box-shadow:

    0 0 50px #38bdf8;

}



.footer{

    margin-top:30px;

    color:#bae6fd;

    font-size:14px;

}


</style>

</head>


<body>


<div class="card">


<div class="logo">🧠</div>


<h1>
تحدي العباقرة
</h1>


<p>

هل تملك عقلية البطل؟ 🔥<br>

اختبر ذكاءك، نافس أصدقاءك، واجمع النقاط للوصول للقمة.<br>

كل إجابة تقربك من لقب العبقري.

</p>



<a class="start" href="login.html">

🚀 ابدأ التحدي

</a>



<div class="footer">

الإصدار الأول • 2026

</div>


</div>


</body>
</html>
